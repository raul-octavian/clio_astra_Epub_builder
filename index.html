                    alert('EPUB exporter is unavailable. Refresh the page and try again.');
                    return;
                }
                if (stories.length === 0) {
                    alert('Add at least one story before exporting.');
                    return;
                }

                setIsExportingEpub(true);
                try {
                    const zip = new JSZip();
                    const exportSlug = slugify(getFullVolumeTitle() || bookSettings.seriesTitle);
                    const modifiedAt = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
                    const bookId = bookSettings.isbn.trim() || (globalThis.crypto?.randomUUID ? `urn:uuid:${globalThis.crypto.randomUUID()}` : `urn:uuid:clio-astra-${Date.now()}`);
                    const storyBundles = stories.map((story) => ({ story, pages: paginateStoryContent(story.masterContent) }));
                    const assetResults = await Promise.all(Object.entries(icons).map(async ([key, icon]) => [key, await buildEpubImageAsset({ url: icon.src, fileName: `${key}.png`, mediaType: EPUB_EXPORT_CONFIG.iconMediaType, quality: 1 })]));
                    const assetByKey = Object.fromEntries(assetResults);
                    const assetHrefByKey = Object.fromEntries(Object.entries(assetByKey).map(([key, asset]) => [key, `${EPUB_EXPORT_CONFIG.imagesDir}/${asset.fileName}`]));
                    let coverAsset = null;
                    const bookCoverDirectUrl = toDirectGithubRawUrl(bookSettings.coverImage || '');
                    if (bookCoverDirectUrl) {
                        const bookCoverRaster = getEpubCoverRasterExport(bookCoverDirectUrl);
                        coverAsset = await buildEpubImageAsset({
                            url: bookCoverDirectUrl,
                            fileName: `cover.${bookCoverRaster.fileExtension}`,
                            mediaType: bookCoverRaster.mediaType,
                            quality: bookCoverRaster.quality,
                            maxWidth: PAGE_LAYOUT.width,
                            maxHeight: PAGE_LAYOUT.height
                        });
                    }

                    let logicalPageNumber = 2;
                    if (bookSettings.includeDedicationPage) logicalPageNumber += 1;
                    if (bookSettings.includeTableOfContentsPage) logicalPageNumber += 1;
                    if (bookSettings.includeCharacterProfilesPage) logicalPageNumber += 1;
                    if (bookSettings.includeCopyrightPage) logicalPageNumber += 1;
                    const storyStartPageNumbers = {};
                    storyBundles.forEach((bundle) => {
                        storyStartPageNumbers[bundle.story.id] = logicalPageNumber;
                        logicalPageNumber += 1 + bundle.pages.length;
                    });

                    zip.file('mimetype', 'application/epub+zip', { compression: 'STORE' });
                    zip.file('META-INF/container.xml', buildContainerXml());
                    zip.file('META-INF/com.apple.ibooks.display-options.xml', buildAppleDisplayOptions());
                    zip.file(`OEBPS/${EPUB_EXPORT_CONFIG.stylesheetPath}`, buildEpubStylesheet());

                    const assetEntries = [];
                    Object.entries(assetByKey).forEach(([key, asset]) => {
                        const href = `${EPUB_EXPORT_CONFIG.imagesDir}/${asset.fileName}`;
                        zip.file(`OEBPS/${href}`, asset.data);
                        assetEntries.push({ id: `asset-${key}`, href, mediaType: asset.mediaType });
                    });
                    let coverAssetHref = null;
                    if (coverAsset) {
                        coverAssetHref = `${EPUB_EXPORT_CONFIG.imagesDir}/${coverAsset.fileName}`;
                        zip.file(`OEBPS/${coverAssetHref}`, coverAsset.data);
                        assetEntries.push({ id: 'asset-cover', href: coverAssetHref, mediaType: coverAsset.mediaType });
                    }

                    const storyTitleCoverAssetHrefByStoryId = {};
                    for (let storyIdx = 0; storyIdx < storyBundles.length; storyIdx += 1) {
                        const story = storyBundles[storyIdx].story;
                        const rawUrl = toDirectGithubRawUrl(typeof story.coverImage === 'string' ? story.coverImage : '');
                        if (!rawUrl) continue;
                        try {
                            const raster = getEpubCoverRasterExport(rawUrl);
                            const fileName = `story-title-${storyIdx}.${raster.fileExtension}`;
                            const asset = await buildEpubImageAsset({
                                url: rawUrl,
                                fileName,
                                mediaType: raster.mediaType,
                                quality: raster.quality,
                                maxWidth: PAGE_LAYOUT.width * 2,
                                maxHeight: PAGE_LAYOUT.height * 2
                            });
                            const href = `${EPUB_EXPORT_CONFIG.imagesDir}/${asset.fileName}`;
                            zip.file(`OEBPS/${href}`, asset.data);
                            assetEntries.push({ id: `asset-story-title-${storyIdx}`, href, mediaType: asset.mediaType });
                            storyTitleCoverAssetHrefByStoryId[story.id] = href;
                        } catch (coverErr) {
                            console.warn('Story title cover export skipped', story.title, coverErr);
                        }
                    }

                    const pageEntries = [];
                    let physicalPageNumber = 1;
                    const addPage = (title, markup) => {
                        const href = `${EPUB_EXPORT_CONFIG.pagesDir}/${buildEpubPageFileName(physicalPageNumber)}`;
                        const id = `page-${String(physicalPageNumber).padStart(3, '0')}`;
                        zip.file(`OEBPS/${href}`, markup);
                        pageEntries.push({ id, href, title });
                        physicalPageNumber += 1;
                    };

                    addPage('Cover', buildBookCoverPageXhtml(coverAssetHref));
                    addPage('Title Page', buildBookTitlePageXhtml());
                    if (bookSettings.includeCopyrightPage) addPage('Copyright', buildCopyrightPageXhtml());
                    if (bookSettings.includeDedicationPage) addPage('Dedication', buildDedicationPageXhtml());
                    if (bookSettings.includeTableOfContentsPage) addPage('Table of Contents', buildTableOfContentsPageXhtml(storyBundles.map((bundle) => ({ title: bundle.story.title, pageNumber: storyStartPageNumbers[bundle.story.id] }))));
                    if (bookSettings.includeCharacterProfilesPage) addPage(bookSettings.characterProfilesTitle, buildCharacterProfilesPageXhtml(assetHrefByKey));
                    storyBundles.forEach((bundle) => {
                        addPage(bundle.story.title, buildStoryTitlePageXhtml(bundle.story, storyTitleCoverAssetHrefByStoryId[bundle.story.id]));
                        bundle.pages.forEach((pageBlocks, index) => addPage(`${bundle.story.title} ${index + 1}`, buildStoryPageXhtml(bundle.story, pageBlocks, storyStartPageNumbers[bundle.story.id] + 1 + index, assetHrefByKey)));
                    });
                    if (bookSettings.includeStemGlossaryPage) addPage(bookSettings.glossaryTitle, buildGlossaryPageXhtml());

                    zip.file('OEBPS/nav.xhtml', buildNavDocument(pageEntries));
                    zip.file('OEBPS/package.opf', buildPackageDocument({ bookId, modifiedAt, pageEntries, assetEntries, coverAssetHref }));

                    const epubBlob = await zip.generateAsync({ type: 'blob', mimeType: 'application/epub+zip', compression: 'DEFLATE', compressionOptions: { level: EPUB_EXPORT_CONFIG.compressionLevel } });
                    const downloadUrl = URL.createObjectURL(epubBlob);
                    const link = document.createElement('a');
                    link.href = downloadUrl;
                    link.download = `${exportSlug}.epub`;
                    link.click();
                    setTimeout(() => URL.revokeObjectURL(downloadUrl), 0);
                } catch (error) {
                    console.error('EPUB export failed', error);
                    alert(`EPUB export failed: ${error.message}`);
                } finally {
                    setIsExportingEpub(false);
                }
            };

            const renderBlock = (block, index, pageBlocks) => {
                const prevBlock = index > 0 ? pageBlocks[index - 1] : null;
                const marginTop = (block.isSound && prevBlock?.isSound) ? '20px' : index === 0 ? '0px' : '58px';

                if (block.type === 's') {
                    return (
                        <div key={block.id} style={{ marginTop, transform: `translateX(${index % 2 === 0 ? '60px' : '-60px'})`, fontFamily: "'Patrick Hand', cursive" }} className="w-full flex justify-center text-slate-900">
                            <span className="text-[80px] font-bold tracking-tight lowercase select-none preserve-lines text-center" style={{ color: COLOR_HEX.sfxText }}>{block.content}</span>
                        </div>
                    );
                }

                const char = icons[block.type];
                if (char) {
                    return (
                        <div key={block.id} className="flex gap-12 items-start" style={{ marginTop }}>
                            <div className={`character-avatar w-[160px] h-[160px] shrink-0 rounded-full border-4 ${char.bg} flex items-center justify-center bg-white shadow-sm relative`} style={{ borderColor: char.borderColor }} role="img">
                                <img src={char.src} alt="" className="character-avatar-image z-10" onError={(e) => {
                                    e.target.style.display = 'none';
                                    if (e.target.nextSibling) e.target.nextSibling.style.display = 'flex';
                                }} />
                                <div className="absolute inset-0 hidden items-center justify-center text-7xl opacity-40 select-none">{char.emoji}</div>
                            </div>
                            <p className={`preserve-lines ${block.isSound ? 'text-[80px] font-bold tracking-tight lowercase pt-4' : 'text-[36px] leading-[1.4] text-slate-900 pt-8'}`} style={{ fontFamily: block.isSound ? "'Patrick Hand', cursive" : "'Tenor Sans', sans-serif", color: block.isSound ? char.soundColor : undefined }}>
                                {block.content}
                            </p>
                        </div>
                    );
                }
                return <p key={block.id} className="text-[36px] leading-[1.5] text-slate-800 preserve-lines" style={{ marginTop, fontFamily: "'Tenor Sans', sans-serif" }}>{block.content}</p>;
            };

            const previewStoryBundles = stories.map((story) => ({
                story,
                pages: paginateStoryContent(story.masterContent)
            }));

            const previewStoryStartPageNumbers = {};
            let previewLogicalPageNumber = 2;
            if (bookSettings.includeDedicationPage) previewLogicalPageNumber += 1;
            if (bookSettings.includeTableOfContentsPage) previewLogicalPageNumber += 1;
            if (bookSettings.includeCharacterProfilesPage) previewLogicalPageNumber += 1;
            if (bookSettings.includeCopyrightPage) previewLogicalPageNumber += 1;
            previewStoryBundles.forEach((bundle) => {
                previewStoryStartPageNumbers[bundle.story.id] = previewLogicalPageNumber;
                previewLogicalPageNumber += 1 + bundle.pages.length;
            });

            const activeStoryStartPageNumber = activeStory ? previewStoryStartPageNumbers[activeStory.id] : 0;
            const tocEntries = previewStoryBundles.map((bundle) => ({
                title: bundle.story.title,
                pageNumber: previewStoryStartPageNumbers[bundle.story.id]
            }));

            const PreviewPageFrame = ({ children, backgroundImage, storyTitleCoverBleedStyle, showPageNumber = false, pageNumber }) => {
                const isEditor = !isExporting;
                const currentScale = isEditor ? PAGE_LAYOUT.editorScale : 1.0;
                const wrappedW = PAGE_LAYOUT.width * currentScale;
                const wrappedH = PAGE_LAYOUT.height * currentScale;

                return (
                    <div className="page-wrapper" style={{ width: wrappedW, height: wrappedH, marginBottom: isEditor ? '80px' : '0' }}>
                        <div className="canvas-container flex flex-col" style={{ transform: isEditor ? `scale(${currentScale})` : 'none', transformOrigin: 'top left' }}>
                            {backgroundImage && (
                                <div className="full-bleed-bg" style={{ ...COVER_IMAGE_STYLE, backgroundImage: `url(${backgroundImage})` }} />
                            )}
                            {!backgroundImage && storyTitleCoverBleedStyle && (
                                <div className="full-bleed-bg" style={storyTitleCoverBleedStyle} />
                            )}
                            <div className="content-layer">
                                {children}
                                {showPageNumber && <div className="absolute bottom-[100px] right-[200px] font-black text-7xl italic opacity-50 select-none text-slate-300">{pageNumber}</div>}
                            </div>
                        </div>
                    </div>
                );
            };

            const renderParagraphGroup = (textValue, className = "text-[36px] leading-[1.5] text-slate-800") => (
                <div className="space-y-6">
                    {parseMultilineItems(textValue).map((paragraph, index) => (
                        <p key={index} className={className} style={{ fontFamily: "'Tenor Sans', sans-serif" }}>{paragraph}</p>
                    ))}
                </div>
            );

            const renderBookTitlePreview = () => (
                <PreviewPageFrame>
                    <div className="flex-1 flex flex-col items-center justify-center text-center">
                        <div className="title-card bg-white/80 border-white/40 backdrop-blur-2xl px-16 py-12 rounded-[80px] border-2 max-w-[1100px] shadow-2xl">
                            <p className="text-[18px] font-bold uppercase tracking-[0.3em] mb-6 text-slate-700">{bookSettings.seriesTitle}</p>
                            <h1 className="title-heading text-[88px] font-black tracking-tight uppercase leading-[0.9] text-slate-900" style={{ fontFamily: "'Playfair Display', serif" }}>{bookSettings.volumeTitle || "UNTITLED"}</h1>
                            {bookSettings.volumeSubtitle?.trim() && <p className="title-subheading mt-7 max-w-[820px] mx-auto text-center text-[40px] font-bold uppercase tracking-[0.04em] leading-[1.2] text-slate-600">{bookSettings.volumeSubtitle.trim()}</p>}
                        </div>
                    </div>
                </PreviewPageFrame>
            );

            const renderDedicationPreview = () => (
                <PreviewPageFrame>
                    <div className="flex-1 flex items-center justify-center text-center">
                        <div className="max-w-[1040px]">
                            {renderParagraphGroup(bookSettings.dedicationText, "text-[42px] leading-[1.5] text-slate-800 italic")}
                        </div>
                    </div>
                </PreviewPageFrame>
            );

            const renderTocPreview = () => (
                <PreviewPageFrame>
                    <div>
                        <h2 className="text-[76px] font-black text-slate-900 mb-10" style={{ fontFamily: "'Playfair Display', serif" }}>Table of Contents</h2>
                        <div className="space-y-4">
                            {tocEntries.map((entry) => (
                                <div key={entry.title} className="flex justify-between gap-6 border-b border-slate-200 pb-3 text-[30px] text-slate-800">
                                    <span>{entry.title}</span>
                                    <span>{entry.pageNumber}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </PreviewPageFrame>
            );

            const renderCharacterProfilesPreview = () => (
                <PreviewPageFrame>
                    <div>
                        <h2 className="text-[76px] font-black text-slate-900 mb-10" style={{ fontFamily: "'Playfair Display', serif" }}>{bookSettings.characterProfilesTitle}</h2>
                        <div>
                            {getCharacterProfiles().map((profile, index) => (
                                <div key={profile.key} className="flex gap-12 items-start" style={{ marginTop: index === 0 ? 0 : `${PAGINATION_CONFIG.blockGap}px` }}>
                                    <div className={`character-avatar w-[150px] h-[150px] shrink-0 rounded-full border-4 ${icons[profile.key].bg} flex items-center justify-center bg-white shadow-sm relative`} style={{ borderColor: icons[profile.key].borderColor }}>
                                        <img src={icons[profile.key].src} alt={profile.name} className="character-avatar-image" onError={(e) => { e.target.style.display = 'none'; }} />
                                    </div>
                                    <div>
                                        <h3 className="text-[40px] font-black text-slate-900 mb-2">{profile.name}</h3>
                                        <p className="text-[30px] leading-[1.4] text-slate-700" style={{ fontFamily: "'Tenor Sans', sans-serif" }}>{profile.bio}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </PreviewPageFrame>
            );

            const renderGlossaryPreview = () => (
                <PreviewPageFrame>
                    <div>
                        <h2 className="text-[76px] font-black text-slate-900 mb-10" style={{ fontFamily: "'Playfair Display', serif" }}>{bookSettings.glossaryTitle}</h2>
                        <div className="space-y-4">
                            {parseMultilineItems(bookSettings.glossaryText).map((item, index) => (
                                <p key={index} className="text-[28px] leading-[1.35] text-slate-800" style={{ fontFamily: "'Tenor Sans', sans-serif" }}>{item}</p>
                            ))}
                        </div>
                    </div>
                </PreviewPageFrame>
            );

            const renderCopyrightPreview = () => (
                <PreviewPageFrame>
                    <div className="space-y-8">
                        <h2 className="text-[76px] font-black text-slate-900" style={{ fontFamily: "'Playfair Display', serif" }}>Copyright</h2>
                        {renderParagraphGroup(bookSettings.copyrightNotice, "text-[30px] leading-[1.45] text-slate-800")}
                        {bookSettings.isbn && <p className="text-[30px] leading-[1.45] text-slate-800">ISBN: {bookSettings.isbn}</p>}
                        {renderParagraphGroup(bookSettings.publisher, "text-[30px] leading-[1.45] text-slate-800")}
                        {renderParagraphGroup(bookSettings.noAiTrainingClause, "text-[28px] leading-[1.45] text-slate-700")}
                    </div>
                </PreviewPageFrame>
            );

            const renderStoryTitlePreview = () => (
                <PreviewPageFrame storyTitleCoverBleedStyle={activeStory ? getStoryTitleCoverBleedStyle(activeStory) : null}>
                    <div className="flex-1 flex flex-col items-center justify-start pt-20 text-center">
                        <div className="title-card bg-white/80 border-white/40 backdrop-blur-2xl px-16 py-12 rounded-[80px] border-2 max-w-[1100px] shadow-2xl">
                            <p className="text-[18px] font-bold uppercase tracking-[0.3em] mb-6 text-slate-700">{bookSettings.seriesTitle}</p>
                            <h1 className="title-heading text-[110px] font-black tracking-tight uppercase leading-[0.9] text-slate-900" style={{ fontFamily: "'Playfair Display', serif" }}>{activeStory?.title || "UNTITLED"}</h1>
                        </div>
                    </div>
                </PreviewPageFrame>
            );

            const PageFrame = ({ children, isTitle, story, pNum }) => {
                const isEditor = !isExporting;
                const currentScale = isEditor ? PAGE_LAYOUT.editorScale : 1.0;
                const wrappedW = PAGE_LAYOUT.width * currentScale;
                const wrappedH = PAGE_LAYOUT.height * currentScale;
                const bookCoverDisplayUrl = toDirectGithubRawUrl(bookSettings.coverImage || '');

                return (
                    <div className="page-wrapper" style={{ 
                        width: wrappedW, 
                        height: wrappedH, 
                        marginBottom: isEditor ? '80px' : '0',
                    }}>
                        <div className="canvas-container flex flex-col" style={{ 
                            transform: isEditor ? `scale(${currentScale})` : 'none', 
                            transformOrigin: 'top left' 
                        }}>
                            {isTitle && (
                                <div className="full-bleed-bg" style={bookCoverDisplayUrl ? { ...COVER_IMAGE_STYLE, backgroundImage: `url(${bookCoverDisplayUrl})` } : undefined}>
                                    {!bookCoverDisplayUrl && (
                                        <div className="text-slate-300 font-black text-8xl uppercase opacity-20 rotate-[-15deg] select-none text-center px-24 leading-none">
                                            {bookSettings.volumeTitle || "STORY"}<br/>COVER ART
                                        </div>
                                    )}
                                </div>
                            )}
                            <div className={`content-layer${isTitle ? ' content-layer--volume-cover' : ''}`}>
                                {isTitle ? (
                                    <div className="flex w-full flex-col items-center justify-start">
                                        <div className={`title-card ${activeStory?.theme === 'light' ? 'bg-black/50 border-black/10' : 'bg-white/50 border-white/20'} backdrop-blur-2xl px-16 py-12 rounded-[80px] border-2 text-center max-w-[1100px] shadow-2xl`}>
                                            <p className={`text-[18px] font-bold uppercase tracking-[0.3em] mb-6 ${activeStory?.theme === 'light' ? 'text-white/80' : 'text-slate-700'}`}>{bookSettings.seriesTitle}</p>
                                            <h1 className={`title-heading text-[88px] font-black tracking-tight uppercase leading-[0.9] ${activeStory?.theme === 'light' ? 'text-white' : 'text-slate-900'}`} style={{ fontFamily: "'Playfair Display', serif" }}>{bookSettings.volumeTitle || "UNTITLED"}</h1>
                                            {bookSettings.volumeSubtitle?.trim() && <p className={`title-subheading mt-7 max-w-[820px] mx-auto text-center text-[40px] font-bold uppercase tracking-[0.04em] leading-[1.2] ${activeStory?.theme === 'light' ? 'text-white/85' : 'text-slate-600'}`}>{bookSettings.volumeSubtitle.trim()}</p>}
                                        </div>
                                    </div>
                                ) : children}
                                {!isTitle && <div className="absolute bottom-[100px] right-[200px] font-black text-7xl italic opacity-50 select-none text-slate-300">{pNum}</div>}
                            </div>
                        </div>
                    </div>
                );
            };

            const runExport = () => {
                setIsExporting(true);
                requestAnimationFrame(() => {
                    requestAnimationFrame(async () => {
                        await waitForPrintAssets();
                        window.print();
                    });
                });
            };

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* SIDEBAR */}
                    <div className="no-print w-[460px] bg-white border-r border-slate-200 p-8 flex flex-col shadow-xl z-30 overflow-y-auto shrink-0">
                        <div className="mb-6 pb-4 border-b">
                            <h2 className="font-black text-slate-900 uppercase tracking-tighter text-xl italic mb-4 leading-none">Clio Studio 3.4</h2>
                            <button onClick={runExport} className="w-full bg-green-600 text-white p-4 rounded-xl font-bold hover:bg-green-700 shadow-lg flex items-center justify-center gap-2 mb-3 hover:scale-[1.02] transition-transform">
                                <span>📚</span> EXPORT FULL PDF
                            </button>
                            <button onClick={runEpubExport} disabled={isExportingEpub} className="w-full bg-indigo-600 text-white p-4 rounded-xl font-bold hover:bg-indigo-700 shadow-lg flex items-center justify-center gap-2 mb-4 hover:scale-[1.02] transition-transform disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:scale-100">
                                <span>📦</span> {isExportingEpub ? 'BUILDING EPUB...' : 'EXPORT EPUB'}
                            </button>
                            <div className="flex gap-2">
                                <button onClick={() => {
                                    const dataStr = JSON.stringify({ bookSettings, stories }, null, 2);
                                    const link = document.createElement('a');
                                    const downloadUrl = URL.createObjectURL(new Blob([dataStr], { type: 'application/json' }));
                                    link.href = downloadUrl;
                                    link.download = `clio_project_v3.4.json`;
                                    link.click();
                                    setTimeout(() => URL.revokeObjectURL(downloadUrl), 0);
                                }} className="flex-1 bg-slate-800 text-white text-[10px] p-3 rounded-lg font-bold hover:bg-black">💾 SAVE</button>
                                <button onClick={() => fileInputRef.current.click()} className="flex-1 bg-slate-100 text-slate-600 text-[10px] p-3 rounded-lg font-bold border border-slate-200">📂 LOAD</button>
                                <input type="file" ref={fileInputRef} className="hidden" accept=".json" onChange={(e) => {
                                    const file = e.target.files?.[0];
                                    if (!file) return;
                                    const reader = new FileReader();
                                    reader.onload = (ev) => {
                                        try {
                                            const parsed = JSON.parse(ev.target.result);
                                            const normalizedAppData = normalizeAppData(parsed);
                                            if (normalizedAppData.stories.length === 0) throw new Error("Invalid project format");
                                            setBookSettings(normalizedAppData.bookSettings);
                                            setStories(normalizedAppData.stories);
                                            setSelectedStoryIndex(0);
                                        } catch (err) {
                                            console.error("Project import failed", err);
                                            alert("Invalid project file");
                                        } finally {
                                            e.target.value = '';
                                        }
                                    };
                                    reader.onerror = () => {
                                        alert("Failed to read file");
                                        e.target.value = '';
                                    };
                                    reader.readAsText(file);
                                }} />
                            </div>
                        </div>

                        <div className="space-y-6 flex-1">
                            <div className="flex items-center justify-between">
                                <label className="text-[10px] uppercase font-bold text-slate-400 tracking-widest text-teal-600 font-black">Pixel Precise: 200px Buf</label>
                                <button onClick={() => {
                                    const newS = createStory({ id: Date.now(), title: "NEW STORY" });
                                    setStories([...stories, newS]);
                                    setSelectedStoryIndex(stories.length);
                                }} className="text-[10px] bg-teal-600 text-white px-3 py-1 rounded-full font-bold hover:bg-teal-700">+ Story</button>
                            </div>

                            <div className="space-y-2 max-h-56 overflow-y-auto bg-slate-50 p-2 rounded-xl border">
                                {stories.map((s, idx) => (
                                    <div key={s.id} className="flex gap-2">
                                        <button onClick={() => { setSelectedStoryIndex(idx); if(viewportRef.current) viewportRef.current.scrollTop = 0; }} className={`flex-1 text-left p-3 rounded-lg text-xs font-bold transition-all ${selectedStoryIndex === idx ? 'bg-teal-600 text-white shadow-md' : 'bg-white border hover:border-teal-400'}`}>
                                            {idx + 1}. {s.title}
                                        </button>
                                        <div className="flex flex-col gap-1">
                                            <button onClick={() => moveStory(idx, -1)} disabled={idx === 0} className="w-8 h-8 rounded-lg border bg-white text-slate-500 disabled:opacity-30 disabled:cursor-not-allowed">↑</button>
                                            <button onClick={() => moveStory(idx, 1)} disabled={idx === stories.length - 1} className="w-8 h-8 rounded-lg border bg-white text-slate-500 disabled:opacity-30 disabled:cursor-not-allowed">↓</button>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {activeStory && (
                                <div className="pt-4 border-t space-y-6">
                                    <div className="space-y-4">
                                        <h3 className="text-[10px] uppercase font-bold text-slate-400 tracking-widest">Book Metadata</h3>
                                        <input className="w-full border-2 border-slate-100 rounded-xl p-3 font-bold text-slate-900 focus:border-teal-500 outline-none" value={bookSettings.seriesTitle} onChange={(e) => updateBookSetting('seriesTitle', e.target.value)} placeholder="Series Title" />
                                        <textarea className="w-full border-2 border-slate-100 rounded-xl p-3 text-sm font-bold text-slate-900 focus:border-teal-500 outline-none leading-relaxed" rows={2} value={bookSettings.volumeTitle} onChange={(e) => updateBookSetting('volumeTitle', e.target.value)} placeholder="Volume Title" />
                                        <textarea className="w-full border-2 border-slate-100 rounded-xl p-3 text-sm text-slate-900 focus:border-teal-500 outline-none leading-relaxed" rows={2} value={bookSettings.volumeSubtitle || ''} onChange={(e) => updateBookSetting('volumeSubtitle', e.target.value)} placeholder="Volume Subtitle" />
                                        <input className="w-full border-2 border-slate-100 rounded-xl p-3 text-sm text-slate-900 focus:border-teal-500 outline-none" value={bookSettings.author} onChange={(e) => updateBookSetting('author', e.target.value)} placeholder="Author" />
                                        <input className="w-full border-2 border-slate-100 rounded-xl p-3 text-sm text-slate-900 focus:border-teal-500 outline-none" value={bookSettings.publisher} onChange={(e) => updateBookSetting('publisher', e.target.value)} placeholder="Publisher" />
                                        <input className="w-full border-2 border-slate-100 rounded-xl p-3 text-sm text-slate-900 focus:border-teal-500 outline-none" value={bookSettings.isbn} onChange={(e) => updateBookSetting('isbn', e.target.value)} placeholder="ISBN" />
                                        <textarea className="w-full border-2 border-slate-100 rounded-xl p-3 text-sm text-slate-900 focus:border-teal-500 outline-none leading-relaxed" rows={2} value={bookSettings.categoriesText} onChange={(e) => updateBookSetting('categoriesText', e.target.value)} placeholder="Categories (comma separated)" />
                                        <div>
                                            <label className="text-[10px] uppercase font-bold text-slate-400 mb-1 block tracking-widest">Book Cover URL</label>
                                            <input className="w-full border-2 border-slate-100 rounded-xl p-3 text-xs font-medium text-slate-900 focus:border-teal-500 outline-none" value={bookSettings.coverImage} onChange={(e) => updateBookSetting('coverImage', toDirectGithubRawUrl(e.target.value))} placeholder="https://github.com/raul-octavian/clio_astra_assets/blob/main/The_stuck_car.webp" />
                                            <div className="flex gap-2 mt-2">
                                                <button onClick={clearCoverImage} disabled={!bookSettings.coverImage} className="bg-white text-[10px] px-4 py-3 rounded-lg font-bold border border-slate-200 text-slate-500 disabled:opacity-40 disabled:cursor-not-allowed">Clear</button>
                                            </div>
                                            <p className="mt-1 text-[10px] text-slate-400 leading-snug">Files on the default branch can live in the repo root (not only <span className="font-mono">/assets</span>). Paste the normal GitHub file page URL or a raw link; blob pages are rewritten to <span className="font-mono">raw.githubusercontent.com</span> automatically.</p>
                                            <p className={`mt-2 text-[10px] italic ${coverImageStatus.state === COVER_URL_STATUS.valid ? 'text-emerald-600' : coverImageStatus.state === COVER_URL_STATUS.invalid ? 'text-rose-600' : coverImageStatus.state === COVER_URL_STATUS.checking ? 'text-amber-600' : 'text-slate-400'}`}>{coverImageStatus.message}</p>
                                        </div>
                                        <div className="grid grid-cols-2 gap-2 text-xs">
                                            <label className="flex items-center gap-2 bg-slate-50 rounded-lg p-2"><input type="checkbox" checked={bookSettings.includeDedicationPage} onChange={(e) => updateBookSetting('includeDedicationPage', e.target.checked)} />Dedication</label>
                                            <label className="flex items-center gap-2 bg-slate-50 rounded-lg p-2"><input type="checkbox" checked={bookSettings.includeTableOfContentsPage} onChange={(e) => updateBookSetting('includeTableOfContentsPage', e.target.checked)} />Table of Contents</label>
                                            <label className="flex items-center gap-2 bg-slate-50 rounded-lg p-2"><input type="checkbox" checked={bookSettings.includeCharacterProfilesPage} onChange={(e) => updateBookSetting('includeCharacterProfilesPage', e.target.checked)} />Character Profiles</label>
                                            <label className="flex items-center gap-2 bg-slate-50 rounded-lg p-2"><input type="checkbox" checked={bookSettings.includeStemGlossaryPage} onChange={(e) => updateBookSetting('includeStemGlossaryPage', e.target.checked)} />STEM Glossary</label>
                                            <label className="flex items-center gap-2 bg-slate-50 rounded-lg p-2 col-span-2"><input type="checkbox" checked={bookSettings.includeCopyrightPage} onChange={(e) => updateBookSetting('includeCopyrightPage', e.target.checked)} />Copyright Page</label>
                                        </div>
                                        {bookSettings.includeDedicationPage && <textarea className="w-full border-2 border-slate-100 rounded-xl p-3 text-sm text-slate-900 focus:border-teal-500 outline-none leading-relaxed" rows={3} value={bookSettings.dedicationText} onChange={(e) => updateBookSetting('dedicationText', e.target.value)} placeholder="Dedication text" />}
                                        {bookSettings.includeCharacterProfilesPage && (
                                            <div className="space-y-2">
                                                <input className="w-full border-2 border-slate-100 rounded-xl p-3 text-sm font-bold text-slate-900 focus:border-teal-500 outline-none" value={bookSettings.characterProfilesTitle} onChange={(e) => updateBookSetting('characterProfilesTitle', e.target.value)} placeholder="Character Profiles Title" />
                                                <textarea className="w-full border-2 border-slate-100 rounded-xl p-3 text-sm text-slate-900 focus:border-teal-500 outline-none leading-relaxed" rows={3} value={bookSettings.clioBio} onChange={(e) => updateBookSetting('clioBio', e.target.value)} placeholder="Clio bio" />
                                                <textarea className="w-full border-2 border-slate-100 rounded-xl p-3 text-sm text-slate-900 focus:border-teal-500 outline-none leading-relaxed" rows={3} value={bookSettings.zipBio} onChange={(e) => updateBookSetting('zipBio', e.target.value)} placeholder="Zip bio" />
                                                <textarea className="w-full border-2 border-slate-100 rounded-xl p-3 text-sm text-slate-900 focus:border-teal-500 outline-none leading-relaxed" rows={3} value={bookSettings.baronBio} onChange={(e) => updateBookSetting('baronBio', e.target.value)} placeholder="Baron bio" />
                                                <textarea className="w-full border-2 border-slate-100 rounded-xl p-3 text-sm text-slate-900 focus:border-teal-500 outline-none leading-relaxed" rows={3} value={bookSettings.mistyBio} onChange={(e) => updateBookSetting('mistyBio', e.target.value)} placeholder="Misty bio" />
                                            </div>
                                        )}
                                        {bookSettings.includeStemGlossaryPage && (
                                            <div className="space-y-2">
                                                <input className="w-full border-2 border-slate-100 rounded-xl p-3 text-sm font-bold text-slate-900 focus:border-teal-500 outline-none" value={bookSettings.glossaryTitle} onChange={(e) => updateBookSetting('glossaryTitle', e.target.value)} placeholder="Glossary Title" />
                                                <textarea className="w-full border-2 border-slate-100 rounded-xl p-3 text-sm text-slate-900 focus:border-teal-500 outline-none leading-relaxed" rows={6} value={bookSettings.glossaryText} onChange={(e) => updateBookSetting('glossaryText', e.target.value)} placeholder="One glossary term per line" />
                                            </div>
                                        )}
                                        {bookSettings.includeCopyrightPage && (
                                            <div className="space-y-2">
                                                <textarea className="w-full border-2 border-slate-100 rounded-xl p-3 text-sm text-slate-900 focus:border-teal-500 outline-none leading-relaxed" rows={3} value={bookSettings.copyrightNotice} onChange={(e) => updateBookSetting('copyrightNotice', e.target.value)} placeholder="Copyright notice" />
                                                <textarea className="w-full border-2 border-slate-100 rounded-xl p-3 text-sm text-slate-900 focus:border-teal-500 outline-none leading-relaxed" rows={4} value={bookSettings.noAiTrainingClause} onChange={(e) => updateBookSetting('noAiTrainingClause', e.target.value)} placeholder="No AI training clause" />
                                            </div>
                                        )}
                                    </div>

                                    <div className="pt-4 border-t space-y-4">
                                        <h3 className="text-[10px] uppercase font-bold text-slate-400 tracking-widest">Selected Story</h3>
                                        <input className="w-full border-2 border-slate-100 rounded-xl p-3 font-bold text-slate-900 focus:border-teal-500 outline-none" value={activeStory.title} onChange={(e) => updateStory('title', e.target.value.toUpperCase())} placeholder="Title" />
                                        <select value={activeStory.theme} onChange={(e) => updateStory('theme', e.target.value)} className="w-full p-2 text-xs border rounded-lg bg-white font-bold cursor-pointer">
                                            <option value="dark">Story Title Theme: Dark</option>
                                            <option value="light">Story Title Theme: Light</option>
                                        </select>
                                        <div className="space-y-2 rounded-xl border border-slate-100 bg-slate-50/80 p-3">
                                            <label className="text-[10px] uppercase font-bold text-slate-400 block tracking-widest">Story title cover image URL</label>
                                            <input className="w-full border-2 border-slate-100 rounded-xl p-3 text-xs text-slate-900 focus:border-teal-500 outline-none" value={activeStory.coverImage} onChange={(e) => updateStory('coverImage', toDirectGithubRawUrl(e.target.value))} placeholder="https://github.com/raul-octavian/clio_astra_assets/blob/main/The_stuck_car.webp" />
                                            <p className="text-[10px] text-slate-500 leading-snug">Paste a GitHub file link (repo root or any folder) or a <span className="font-mono">raw.githubusercontent.com</span> URL. Blob links are converted automatically. WebP is kept in EPUB when the file ends in <span className="font-mono">.webp</span>. Scale is width as a percentage of the page; position is the anchor (50 / 50 = centered).</p>
                                            <div className="grid grid-cols-3 gap-2">
                                                <label className="flex flex-col gap-1 text-[10px] font-bold text-slate-500 uppercase tracking-wide">
                                                    Scale %
                                                    <input type="number" min={5} max={400} step={1} className="border-2 border-slate-100 rounded-lg p-2 text-xs font-bold text-slate-900 focus:border-teal-500 outline-none bg-white" value={activeStory.coverImageScale} onChange={(e) => updateStory('coverImageScale', clampStoryCoverNumber(parseFloat(e.target.value), 100, 5, 400))} />
                                                </label>
                                                <label className="flex flex-col gap-1 text-[10px] font-bold text-slate-500 uppercase tracking-wide">
                                                    Pos X %
                                                    <input type="number" min={0} max={100} step={0.5} className="border-2 border-slate-100 rounded-lg p-2 text-xs font-bold text-slate-900 focus:border-teal-500 outline-none bg-white" value={activeStory.coverImagePosX} onChange={(e) => updateStory('coverImagePosX', clampStoryCoverNumber(parseFloat(e.target.value), 50, 0, 100))} />
                                                </label>
                                                <label className="flex flex-col gap-1 text-[10px] font-bold text-slate-500 uppercase tracking-wide">
                                                    Pos Y %
                                                    <input type="number" min={0} max={100} step={0.5} className="border-2 border-slate-100 rounded-lg p-2 text-xs font-bold text-slate-900 focus:border-teal-500 outline-none bg-white" value={activeStory.coverImagePosY} onChange={(e) => updateStory('coverImagePosY', clampStoryCoverNumber(parseFloat(e.target.value), 50, 0, 100))} />
                                                </label>
                                            </div>
                                            <button type="button" onClick={clearStoryTitleCover} disabled={!activeStory.coverImage?.trim()} className="text-[10px] font-bold px-3 py-2 rounded-lg border border-slate-200 bg-white text-slate-600 hover:border-teal-400 disabled:opacity-40 disabled:cursor-not-allowed">Clear story cover</button>
                                        </div>
                                        <div>
                                            <label className="text-[10px] uppercase font-bold text-slate-400 mb-1 block tracking-widest">Story Content</label>
                                            <textarea className="w-full border-2 border-slate-100 rounded-xl p-4 text-sm h-[400px] outline-none focus:border-teal-500 font-medium leading-relaxed" value={activeStory.masterContent} onChange={(e) => updateStory('masterContent', e.target.value)} />
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* VIEWPORT */}
                    <div ref={viewportRef} className="canvas-viewport flex-1">
                        <div className="flex flex-col items-center w-full min-h-full">
                            <PageFrame isTitle story={activeStory} />
                            {renderBookTitlePreview()}
                            {bookSettings.includeCopyrightPage && renderCopyrightPreview()}
                            {bookSettings.includeDedicationPage && renderDedicationPreview()}
                            {bookSettings.includeTableOfContentsPage && renderTocPreview()}
                            {bookSettings.includeCharacterProfilesPage && renderCharacterProfilesPreview()}
                            {renderStoryTitlePreview()}
                            {paginatedPages.map((pageBlocks, pIdx) => (
                                <PageFrame key={pIdx} story={activeStory} pNum={activeStoryStartPageNumber + 1 + pIdx}>
                                    <div className="flex-1 flex flex-col">
                                        {pageBlocks.map((b, bIdx) => renderBlock(b, bIdx, pageBlocks))}
                                    </div>
                                </PageFrame>
                            ))}
                            {bookSettings.includeStemGlossaryPage && renderGlossaryPreview()}
                            <button 
                                onClick={() => viewportRef.current.scrollTo({top: 0, behavior: 'smooth'})} 
                                className="no-print mt-12 mb-20 bg-white/20 text-white px-12 py-4 rounded-full font-black text-[10px] uppercase tracking-[0.2em] shadow-xl hover:bg-white hover:text-slate-900 transition-all"
                            >
                                ↑ Back to Top
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
